{% extends "base.html" %} {% block title %} Lupa Password {% endblock %} {%
block public_content %}

<div class="auth-wrapper">
  <div class="card auth-card reveal">
    <img
      class="auth-logo"
      src="{{ url_for('static', filename='img/logo.png') }}"
      alt="Eka Hospital"
    />

    <h1 class="card-title">Lupa Password</h1>

    <p class="card-subtitle">
      Masukkan NIK Anda. Pengajuan akan dikirim ke admin untuk
      ditetapkan password barunya.
    </p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username">NIK</label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username or '' }}"
          required
          autofocus
          placeholder="Masukkan NIK Anda"
        />
      </div>

      <div class="form-group">
        <label for="alasan">Keterangan (opsional)</label>
        <textarea
          id="alasan"
          name="alasan"
          rows="3"
          placeholder="Contoh: lupa password sejak cuti panjang"
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Kirim Pengajuan
      </button>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}">Kembali ke Login</a>
      <span>•</span>
      <a href="{{ url_for('auth.register') }}">Daftar akun baru</a>
    </div>
  </div>
</div>

{% endblock %}
